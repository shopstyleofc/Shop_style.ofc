<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopStyle</title>
<link rel="icon" type="image/png" href="logo.png">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --card-bg: #f8f8f8;
            --navbar-bg: rgba(255, 255, 255, 0.95);
            --border-color: #eeeeee;
            --accent: #007bff;
            --topbar-bg: #333333;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #ffffff;
            --card-bg: #111111;
            --navbar-bg: #000000;
            --border-color: #333333;
            --accent: #007bff;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); scroll-behavior: smooth; }

        .header { position: fixed; top:0; left:0; width:100%; z-index:999; }
        .top-bar { background: var(--topbar-bg); color: white; padding:8px; text-align:center; font-size:12px; font-weight:600; text-transform: uppercase; }
        
        .navbar {
            width:100%; background: var(--navbar-bg); padding:10px 30px;
            display:flex; align-items:center; justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-links { display: flex; gap: 20px; list-style: none; }
        .dropdown { position: relative; }
        .nav-links a { text-decoration: none; color: var(--text-color); font-weight: bold; font-size: 11px; text-transform: uppercase; cursor: pointer; }

        .dropdown-content {
            display: none; position: absolute; background-color: var(--card-bg); min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5); z-index: 1; border: 1px solid var(--border-color); top: 100%;
        }
        .dropdown-content a { padding: 12px 16px; display: block; font-size: 10px; border-bottom: 1px solid var(--border-color); color: var(--text-color); text-decoration: none;}
        .dropdown-content a:hover { background-color: var(--border-color); }
        .dropdown:hover .dropdown-content { display: block; }

        .search-bar { padding: 8px 20px; border-radius: 25px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); outline: none; width: 250px; }

        .main-container { padding: 40px 20px; max-width: 1300px; margin: 120px auto 0; }
        .section-title { font-size: 24px; font-weight: bold; margin: 40px 0 20px; border-left: 5px solid var(--accent); padding-left: 15px; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .product { background: var(--card-bg); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid var(--border-color); }
        .product img { width: 100%; height: 280px; border-radius: 10px; object-fit: cover; margin-bottom: 15px; }
        
        .size-container { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-bottom: 15px; }
        .size-chip { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 5px; cursor: pointer; font-size: 12px; background: var(--bg-color); font-weight: bold; }
        .size-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

        .buy-btn { background: var(--accent); color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .cart-sidebar { position: fixed; right: -100%; top: 0; width: 350px; height: 100%; background: var(--bg-color); z-index: 1000; transition: 0.4s; padding: 25px; display: flex; flex-direction: column; box-shadow: -5px 0 15px rgba(0,0,0,0.2); }
        .cart-sidebar.active { right: 0; }
        .hidden { display: none !important; }
    </style>
</head>

<style>
    .welcome-section {
    text-align: center;
    padding: 60px 20px;
    margin-top: 150px; /* VALOR ALTERADO */
}
.main-logo {
    width: 180px;
    border-radius: 50%; /* VALOR ALTERADO PARA CÍRCULO */
    margin-bottom: 15px;
    border: 5px solid white; /* ADICIONADO */
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
    .welcome-section h1 {
        font-family: 'Arial Black', sans-serif;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
</style>
<body data-theme="dark">

    <div class="header">
    <div class="top-bar">Envios Grátis 24 / 48 Horas</div>
    <div class="navbar">
        <ul class="nav-links">
            <li><a onclick="setSearch('')">INÍCIO</a></li>
            <li class="dropdown">
                <a>SAPATOS ▾</a>
                <div class="dropdown-content">
                    <a onclick="setSearch('LV')">LV</a>
                    <a onclick="setSearch('Dior')">Dior</a>
                </div>
            </li>
            <li class="dropdown">
                <a>FATOS ▾</a>
                <div class="dropdown-content">
                    <a onclick="setSearch('Nike Tech')">Nike Tech</a>
                    <a onclick="setSearch('Yamaha')">Yamaha</a>
                    <a onclick="setSearch('Armani')">Armani</a>
                    <a onclick="setSearch('Lacoste')">Lacoste</a>
                </div>
            </li>
            <li class="dropdown">
                <a>CASACOS ▾</a>
                <div class="dropdown-content">
                    <a onclick="setSearch('Trapstar')">Trapstar</a>
                    <a onclick="setSearch('Ralph Lauren')">Ralph Lauren</a>
                </div>
            </li>
            <li class="dropdown">
                <a>ACESSÓRIOS ▾</a>
                <div class="dropdown-content">
                    <a onclick="setSearch('Gucci')">Gucci</a>
                    <a onclick="setSearch('Prada')">Prada</a>
                </div>
            </li>
        </ul>

        <input type="text" id="search-input" class="search-bar" placeholder="Pesquisar produto..." onkeyup="filterProducts()">
        
        <div style="display:flex; gap:15px; align-items: center;">
            <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size:18px;">🌓</button>
            <button onclick="toggleCart()" style="background:none; border:none; cursor:pointer; font-size:18px; position:relative;">
                🛒 <span id="cart-count" style="position:absolute; top:-8px; right:-8px; background:red; color:white; font-size:10px; padding:2px 6px; border-radius:50%;">0</span>
            </button>
        </div>
    </div>
</div>

<div class="main-container">
    <div id="no-product-msg" class="hidden" style="text-align:center; padding:50px;">❌ Nenhum produto encontrado</div>

    <section class="category-section" id="sec-sapatos">
        <h2 class="section-title">Sapatos</h2>
        <div class="products" id="list-sapatos"></div>
    </section>

    <section class="category-section" id="sec-fatos">
        <h2 class="section-title">Fatos de Inverno</h2>
        <div class="products" id="list-fatos"></div>
    </section>

    <section class="category-section" id="sec-casacos">
        <h2 class="section-title">Casacos</h2>
        <div class="products" id="list-casacos"></div>
    </section>

    <section class="category-section" id="sec-acessorios">
        <h2 class="section-title">Acessórios</h2>
        <div class="products" id="list-acessorios"></div>
    </section>
</div>

<div class="cart-sidebar" id="cart-sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
        <h2>Carrinho</h2>
        <button onclick="toggleCart()" style="background:none; border:none; font-size:30px; cursor:pointer; color: var(--text-color);">&times;</button>
    </div>
    <div id="cart-content" style="flex:1; overflow-y:auto; margin:20px 0;"></div>
    <div style="margin-top: auto;">
        <h3 id="total-price" style="text-align:right; margin-bottom:15px; font-size: 20px;">Total: 0€</h3>
        <button class="buy-btn" onclick="sendToWhatsApp()" style="background:#25d366;">Finalizar Pedido (WhatsApp)</button>
    </div>
</div>

<script>
    const data = {
        sapatos: [
            {id: 'lv1', name: 'LV Skate Preto', price: 90, img: 'lv_skate_preto1.jpg'},
            {id: 'lv2', name: 'LV Skate Bege', price: 90, img: 'lv_skate_bege1.jpg'},
            {id: 'lv3', name: 'LV Skate Cinza', price: 90, img: 'lv_skate_cinza1.jpg'},
            {id: 'lv4', name: 'LV Skate Azul', price: 90, img: 'lv_skate_azul1.jpg'},
            {id: 'lv5', name: 'LV Skate Full Preto', price: 90, img: 'lv_skate_fullpreto1.jpg'},
            {id: 'lv6', name: 'LV Skate Full Cinza', price: 90, img: 'lv_skate_fullcinza1.jpg'},
            {id: 'lv7', name: 'LV Skate Preto/Branco', price: 90, img: 'lv_skate_fullpreto_branco1.jpg'},
            {id: 'dior1', name: 'Dior B30 Brancos', price: 90, img: 'Dior_b30_branco1.jpg'},
            {id: 'dior2', name: 'Dior B22 Azul/Branco', price: 80, img: 'Dior_b22_azul_branco1.jpg'},
            {id: 'dior3', name: 'Dior B22 Pretos', price: 80, img: 'Dior_b22_preto1.jpg'}
        ],
        fatos: [
            {id: 'nk1', name: 'Nike Tech', price: 80, img: 'Nike_tech1.jpg'},
            {id: 'ym1', name: 'Yamaha', price: 80, img: 'Yamaha.jpg'},
            {id: 'am1', name: 'EA7 Armani', price: 80, img: 'S.jpg'},
            {id: 'lc1', name: 'Lacoste', price: 80, img: 'l xl .jpg'},
            {id: 'ua1', name: 'Under Armour', price: 80, img: 'Under.jpg'}
        ],
        casacos: [
            {id: 'rl1', name: 'Casaco Ralph Lauren', price: 90, img: 'Polo.jpg'},
            {id: 'ts1', name: 'Casaco Trapstar', price: 90, img: 'trap.jpg'},
            {id: 'ts2', name: 'Casaco Trapstar', price: 90, img: 'TRAPS.jpg'}
        ],
        acessorios: [
            {id: 'ac1', name: 'Bolsa Prada', price: 70, img: 'Prada.jpg'},
            {id: 'ac2', name: 'Bolsa Gucci', price: 60, img: 'bolsagucci.jpg'},
            {id: 'ac3', name: 'Bolsa Gucci', price: 60, img: 'bolsagucci (2).jpg'},
            {id: 'ac4', name: 'Bolsa Gucci', price: 60, img: 'bolsagucci (3).jpg'},
            {id: 'ac5', name: 'Bolsa Gucci', price: 60, img: 'bolsagucci (4).jpg'},
            {id: 'ac6', name: 'Bolsa Gucci', price: 60, img: 'bolsagucci (5).jpg'},
            {id: 'ac7', name: 'Bolsa Gucci', price: 60, img: 'bolsagucci (6).jpg'},
            {id: 'ac8', name: 'Bolsa Gucci', price: 60, img: 'bolsagucci (7).jpg'},
            {id: 'ac9', name: 'Bolsa Gucci', price: 60, img: 'bolsagucci (8).jpg'},
            {id: 'ac10', name: 'Bolsa Gucci', price: 60, img: 'bolsagucci (9).jpg'}
        ]
    };

    let selectedSizes = {};
    let cart = [];

    function render() {
        document.getElementById('list-sapatos').innerHTML = data.sapatos.map(p => createHTML(p, [40,41,42,43,44,45])).join('');
        document.getElementById('list-fatos').innerHTML = data.fatos.map(p => createHTML(p, ['S','M','L','XL'])).join('');
        document.getElementById('list-casacos').innerHTML = data.casacos.map(p => createHTML(p, ['S','M','L','XL'])).join('');
        document.getElementById('list-acessorios').innerHTML = data.acessorios.map(p => createHTML(p, ['Único'])).join('');
    }

    function createHTML(p, sizes) {
        return `
            <div class="product" data-name="${p.name.toLowerCase()}">
                <img src="${p.img}">
                <h3>${p.name}</h3>
                <p style="font-weight:bold; color:var(--accent); margin:10px 0;">${p.price}€</p>
                <div class="size-container">
                    ${sizes.map(s => `<div class="size-chip" onclick="setProductSize('${p.id}', '${s}', this)">${s}</div>`).join('')}
                </div>
                <button class="buy-btn" onclick="addToCart('${p.id}', '${p.name}', ${p.price})">Adicionar</button>
            </div>
        `;
    }

    function setProductSize(productId, size, element) {
        selectedSizes[productId] = size;
        element.parentElement.querySelectorAll('.size-chip').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
    }

    function addToCart(id, name, price) {
        const size = selectedSizes[id];
        if(!size) return alert("Selecione o tamanho!");
        cart.push({ name, price, size });
        updateCart();
        document.getElementById('cart-sidebar').classList.add('active');
    }

    function updateCart() {
        const content = document.getElementById('cart-content');
        let total = 0;
        content.innerHTML = cart.map((item, index) => {
            total += item.price;
            return `<div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid var(--border-color); padding:5px 0;">
                <span><b>${item.name}</b> (${item.size})</span>
                <button onclick="removeItem(${index})" style="color:red; background:none; border:none; cursor:pointer;">&times;</button>
            </div>`;
        }).join('');
        document.getElementById('cart-count').innerText = cart.length;
        document.getElementById('total-price').innerText = `Total: ${total}€`;
    }

    function removeItem(i) { cart.splice(i, 1); updateCart(); }

    function filterProducts() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const sections = document.querySelectorAll('.category-section');
        let totalFound = 0;

        sections.forEach(section => {
            const products = section.querySelectorAll('.product');
            let sectionHasMatch = false;
            products.forEach(p => {
                const name = p.getAttribute('data-name');
                if(name.includes(query)) {
                    p.classList.remove('hidden');
                    sectionHasMatch = true;
                    totalFound++;
                } else { p.classList.add('hidden'); }
            });
            section.classList.toggle('hidden', !sectionHasMatch);
        });
        document.getElementById('no-product-msg').classList.toggle('hidden', totalFound > 0 || query === "");
    }

    function setSearch(brand) {
        document.getElementById('search-input').value = brand;
        filterProducts();
    }

    function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); }
    function toggleTheme() { document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }

    function sendToWhatsApp() {
        if(cart.length === 0) return alert("Carrinho vazio!");
        
        const agora = new Date();
        const dataFormatada = agora.toLocaleDateString('pt-PT');
        const horaFormatada = agora.toLocaleTimeString('pt-PT', {hour: '2-digit', minute:'2-digit'});
        
        let total = cart.reduce((a, b) => a + b.price, 0);
        
        let texto = `*🛍️ NOVO PEDIDO - SHOP STYLE* %0A`;
        texto += `_Data: ${dataFormatada} | Hora: ${horaFormatada}_ %0A`;
        texto += `------------------------------------------%0A%0A`;
        
        texto += `*DETALHES DOS ARTIGOS:* %0A`;
        cart.forEach((item, index) => {
            texto += `${index + 1}. *${item.name}* %0A`;
            texto += `   └ Tam: ${item.size} | Valor: ${item.price}€ %0A`;
        });
        
        texto += `%0A------------------------------------------%0A`;
        texto += `*TOTAL A PAGAR: ${total}€* %0A`;
        texto += `------------------------------------------%0A%0A`;
        

        window.open(`https://wa.me/351920019932?text=${texto}`, '_blank');
    }

    render();
</script>
</body>
</html>
